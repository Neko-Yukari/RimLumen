name: Deploy docs & WebEditor to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'WebEditor/**'
      - 'Source/RimLumen.Core/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: WebEditor/app/package-lock.json

      - name: Install .NET WASM workload
        run: dotnet workload install wasm-tools wasm-tools-net10

      - name: Run WebEditor offline parity & simulation tests
        run: dotnet run --project WebEditor/RimLumen.WebSim.Tests/RimLumen.WebSim.Tests.csproj -c Release

      - name: Publish RimLumen.WebSim WASM (AOT + SIMD)
        run: |
          dotnet publish WebEditor/RimLumen.WebSim/RimLumen.WebSim.csproj -c Release -o WebEditor/RimLumen.WebSim/spike-out/aot
          rm -rf WebEditor/app/public/wasm/_framework
          mkdir -p WebEditor/app/public/wasm/_framework
          cp -R WebEditor/RimLumen.WebSim/spike-out/aot/wwwroot/_framework/. WebEditor/app/public/wasm/_framework/

      - name: Build WebEditor frontend for Pages /editor/
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          BASE_PATH="${BASE_PATH%/}"
          cd WebEditor/app
          npm ci
          VITE_BASE="${BASE_PATH}/editor/" npm run build

      - name: Assemble GitHub Pages site artifact
        run: |
          rm -rf _site
          mkdir -p _site/editor
          cp -R docs/. _site/
          cp -R WebEditor/app/dist/. _site/editor/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
