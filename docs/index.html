<script>
(function () {
  'use strict';

  const FILES = { zh: './api.md', en: './api.en.md' };
  const STORE_KEY = 'rimlumen-docs-lang';

  const I18N = {
    zh: {
      filter: '筛选章节 / 搜索正文…',
      toc: '目录',
      rawFiles: '原始文件',
      raw: '原始 Markdown：',
      copy: '复制',
      copied: '已复制',
      copyFail: '复制失败',
      loading: '正在加载文档…',
      empty: '没有匹配的章节',
      langLabel: '语言',
      menu: '目录',
      anchor: '链接到本节',
      errTitle: '文档加载失败',
      errBody: (file, why) => '无法获取 ' + file + '（' + why + '）。可直接打开原始文件，或稍后重试。',
      fileTitle: '无法通过 file:// 加载文档',
      fileBody: '浏览器出于跨域（CORS）限制，禁止通过 file:// 打开的页面用 fetch() 读取同目录文件。请改用 HTTP 访问：打开 GitHub Pages 站点，或在仓库根目录运行下面的命令后访问 http://localhost:8000/ 。也可以直接打开原始 Markdown：'
    },
    en: {
      filter: 'Filter sections / search text…',
      toc: 'Contents',
      rawFiles: 'Raw files',
      raw: 'Raw Markdown:',
      copy: 'Copy',
      copied: 'Copied',
      copyFail: 'Copy failed',
      loading: 'Loading documentation…',
      empty: 'No matching sections',
      langLabel: 'Language',
      menu: 'Contents',
      anchor: 'Link to this section',
      errTitle: 'Failed to load the documentation',
      errBody: (file, why) => 'Could not fetch ' + file + ' (' + why + '). Open the raw file directly, or try again later.',
      fileTitle: 'Cannot load the documentation over file://',
      fileBody: 'Browsers block pages opened via file:// from reading sibling files with fetch() (CORS). Serve the folder over HTTP instead: use the GitHub Pages site, or run the command below from the repository root and open http://localhost:8000/ . You can also open the raw Markdown directly:'
    }
  };

  /* ---------- helpers ---------- */

  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');

  // localStorage and history.replaceState throw on file:// and in some privacy modes.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage denied */ }
    }
  };
  const safeDecode = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };

  /* ---------- syntax tint ---------- */

  function tint(code, re, cls) {
    let out = '', last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(code))) {
      const c = cls(m);
      out += esc(code.slice(last, m.index));
      out += c ? '<span class="t-' + c + '">' + esc(m[0]) + '</span>' : esc(m[0]);
      last = m.index + m[0].length;
    }
    return out + esc(code.slice(last));
  }

  const JSON_RE = /("(?:\\.|[^"\\\n])*"(?=\s*:))|("(?:\\.|[^"\\\n])*")|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g;
  const tintJson = code => tint(code, JSON_RE, m => m[1] ? 'key' : m[2] ? 's' : (m[3] || m[4]) ? 'n' : 'c');

  const XML_RE = /<!--[\s\S]*?-->|<[\/?!]?[A-Za-z_][\w:.\-]*|[\/?]?>|"[^"]*"|'[^']*'|[A-Za-z_][\w:.\-]*(?=\s*=)/g;
  function tintXml(code) {
    let inTag = false;
    return tint(code, XML_RE, m => {
      const s = m[0];
      if (s.startsWith('<!--')) return 'c';
      if (s[0] === '<') { inTag = true; return 'tag'; }
      if (s.endsWith('>')) { const was = inTag; inTag = false; return was ? 'tag' : null; }
      if (!inTag) return null;
      return s[0] === '"' || s[0] === "'" ? 's' : 'attr';
    });
  }

  const CS_KEYWORDS = ('abstract as base bool break byte case catch char checked class const continue decimal default delegate do double else enum event ' +
    'explicit extern false finally fixed float for foreach goto if implicit in int interface internal is lock long namespace new null object operator out ' +
    'override params private protected public readonly ref return sbyte sealed short sizeof stackalloc static string struct switch this throw true try ' +
    'typeof uint ulong unchecked unsafe ushort using var virtual void volatile while record init get set async await yield when where with nameof dynamic').split(' ');
  const CS_KW_SET = new Set(CS_KEYWORDS);
  const CS_RE = new RegExp([
    String.raw`//[^\n]*`,
    String.raw`/\*[\s\S]*?\*/`,
    String.raw`@"(?:""|[^"])*"`,
    String.raw`\$?"(?:\\.|[^"\\\n])*"`,
    String.raw`'(?:\\.|[^'\\\n])+'`,
    String.raw`\b(?:` + CS_KEYWORDS.join('|') + String.raw`)\b`,
    String.raw`\b[A-Z][A-Za-z0-9_]*\b`,
    String.raw`\b0[xX][0-9a-fA-F]+\b`,
    String.raw`\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?[fFdDmMuUlL]{0,2}\b`
  ].join('|'), 'g');
  const tintCs = code => tint(code, CS_RE, m => {
    const s = m[0];
    if (s[0] === '/') return 'c';
    if (s[0] === '@' || s[0] === '$' || s[0] === '"' || s[0] === "'") return 's';
    if (s[0] >= '0' && s[0] <= '9') return 'n';
    return CS_KW_SET.has(s) ? 'k' : 't';
  });

  const TINTERS = { json: tintJson, jsonc: tintJson, xml: tintXml, html: tintXml, xaml: tintXml, csharp: tintCs, cs: tintCs, 'c#': tintCs };

  /* ---------- Markdown renderer ---------- */

  const ESCAPABLE = '\\`*_{}[]()#+-.!|<>~';
  const FENCE_RE = /^(\s*)(`{3,}|~{3,})(.*)$/;
  const HEADING_RE = /^ {0,3}(#{1,6})[ \t]+(.*?)(?:[ \t]+#+)?[ \t]*$/;
  const HR_RE = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
  const QUOTE_RE = /^ {0,3}>/;
  const LIST_RE = /^(\s*)([-*+]|\d{1,9}[.)])(?:[ \t]+(.*))?$/;
  const TABLE_SEP_RE = /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)*\|?\s*$/;

  function indentOf(line) {
    let n = 0;
    for (const c of line) {
      if (c === ' ') n++;
      else if (c === '\t') n += 4 - (n % 4);
      else break;
    }
    return n;
  }
  function dedent(line, cols) {
    let n = 0, i = 0;
    while (i < line.length && n < cols) {
      const c = line[i];
      if (c === ' ') n++;
      else if (c === '\t') n += 4 - (n % 4);
      else break;
      i++;
    }
    return line.slice(i);
  }

  function findCloser(s, from, n) {
    let p = s.indexOf('`', from);
    while (p !== -1) {
      let q = p;
      while (s[q] === '`') q++;
      if (q - p === n) return p;
      p = s.indexOf('`', q);
    }
    return -1;
  }

  function safeUrl(url) {
    const probe = unesc(url).replace(/[\u0000-\u0020\u00a0]/g, '');
    const m = /^([a-z][a-z0-9+.\-]*):/i.exec(probe);
    if (m && !/^(https?|mailto)$/i.test(m[1])) return null;
    return { url: url, external: /^https?:/i.test(probe) };
  }

  function emphasis(s) {
    return s
      .replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>')
      .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>')
      .replace(/(^|[^*])\*(?=[^\s*])([^*]*?[^\s*])\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g, '$1<em>$2</em>');
  }

  // Inline pipeline: code spans / backslash escapes and links are stashed as placeholders so emphasis never touches them.
  function inline(src) {
    const store = [];
    const stash = html => '\uE000' + (store.push(html) - 1) + '\uE001';
    const restore = s => s.replace(/\uE000(\d+)\uE001/g, (_, n) => restore(store[+n]));
    const s = src.replace(/[\uE000\uE001]/g, '');

    let out = '';
    for (let i = 0; i < s.length;) {
      const ch = s[i];
      if (ch === '\\' && i + 1 < s.length && ESCAPABLE.includes(s[i + 1])) {
        out += stash(esc(s[i + 1]));
        i += 2;
      } else if (ch === '`') {
        let n = 1;
        while (s[i + n] === '`') n++;
        const close = findCloser(s, i + n, n);
        if (close === -1) {
          out += '`'.repeat(n);
          i += n;
        } else {
          let code = s.slice(i + n, close).replace(/\n/g, ' ');
          if (/^ .*[^ ].* $|^ [^ ] $/.test(code)) code = code.slice(1, -1);
          out += stash('<code>' + esc(code) + '</code>');
          i = close + n;
        }
      } else {
        out += ch;
        i++;
      }
    }

    let h = esc(out);
    h = h.replace(/(!?)\[([^\[\]]*)\]\(\s*([^\s)]*)(?:\s+&quot;([\s\S]*?)&quot;)?\s*\)/g, (m, bang, text, url, title) => {
      const u = safeUrl(restore(url));
      const label = emphasis(text);
      if (!u) return stash(label);
      const t = title ? ' title="' + title + '"' : '';
      if (bang) return stash('<img src="' + u.url + '" alt="' + esc(unesc(restore(text))) + '"' + t + ' loading="lazy">');
      const ext = u.external ? ' target="_blank" rel="noopener noreferrer"' : '';
      return stash('<a href="' + u.url + '"' + t + ext + '>' + label + '</a>');
    });
    h = emphasis(h).replace(/ {2,}\n/g, '<br>\n');
    return restore(h);
  }

  function splitRow(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
    const cells = [];
    let cur = '';
    for (let i = 0; i < s.length; i++) {
      if (s[i] === '\\' && s[i + 1] === '|') { cur += '|'; i++; }
      else if (s[i] === '|') { cells.push(cur.trim()); cur = ''; }
      else cur += s[i];
    }
    cells.push(cur.trim());
    return cells;
  }

  function isTableStart(lines, i) {
    return i + 1 < lines.length && lines[i].includes('|') && lines[i + 1].includes('|') && TABLE_SEP_RE.test(lines[i + 1]) &&
      splitRow(lines[i]).length === splitRow(lines[i + 1]).length;
  }

  function isFenceOpen(line) {
    const m = FENCE_RE.exec(line);
    return !!m && !(m[2][0] === '`' && m[3].includes('`'));
  }

  // True when `lines[i]` ends a running paragraph (or lazy quote continuation).
  function interrupts(lines, i) {
    const l = lines[i];
    if (isFenceOpen(l) || HEADING_RE.test(l) || HR_RE.test(l) || QUOTE_RE.test(l) || isTableStart(lines, i)) return true;
    const m = LIST_RE.exec(l);
    return !!m && !!m[3] && (/[-*+]/.test(m[2]) || parseInt(m[2], 10) === 1);
  }

  function codeBlock(code, lang) {
    const tinter = TINTERS[lang];
    return '<div class="codeblock"><div class="codehead"><span>' + esc(lang || 'text') + '</span>' +
      '<button type="button" class="copy" data-i18n="copy">' + esc(t('copy')) + '</button></div>' +
      '<pre><code>' + (tinter ? tinter(code) : esc(code)) + '</code></pre></div>';
  }

  function uniqueSlug(text, ids) {
    const base = text.toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s+/g, '-') || 'section';
    let id = base, n = 0;
    while (ids.has(id)) id = base + '-' + (++n);
    ids.add(id);
    return id;
  }

  function listAt(lines, start, ctx) {
    const first = LIST_RE.exec(lines[start]);
    const base = indentOf(lines[start]);
    const ordered = /\d/.test(first[2]);
    const startNo = ordered ? parseInt(first[2], 10) : 1;
    const bodies = [];
    let loose = false;
    let i = start;

    while (i < lines.length) {
      const m = LIST_RE.exec(lines[i]);
      if (!m) break;
      const indent = indentOf(lines[i]);
      if (indent < base || indent > base + 1 || /\d/.test(m[2]) !== ordered) break;
      const offset = indent + m[2].length + 1;
      const body = [m[3] || ''];
      i++;
      while (i < lines.length) {
        const l = lines[i];
        if (!l.trim()) {
          let j = i + 1;
          while (j < lines.length && !lines[j].trim()) j++;
          if (j >= lines.length || indentOf(lines[j]) < indent + 2) break;
          for (; i < j; i++) body.push('');
          loose = true;
        } else if (indentOf(l) >= indent + 2) {
          body.push(dedent(l, offset));
          i++;
        } else if (!LIST_RE.test(l) && !interrupts(lines, i)) {
          body.push(l.trim());
          i++;
        } else break;
      }
      bodies.push(body);
      if (i < lines.length && !lines[i].trim()) {
        let j = i;
        while (j < lines.length && !lines[j].trim()) j++;
        const nm = j < lines.length ? LIST_RE.exec(lines[j]) : null;
        const ni = nm ? indentOf(lines[j]) : -1;
        if (nm && ni >= base && ni <= base + 1 && /\d/.test(nm[2]) === ordered) { loose = true; i = j; }
        else break;
      }
    }

    const tag = ordered ? 'ol' : 'ul';
    const open = ordered && startNo !== 1 ? '<ol start="' + startNo + '">' : '<' + tag + '>';
    const html = open + bodies.map(b => '<li>' + blocks(b, ctx, !loose) + '</li>').join('') + '</' + tag + '>';
    return { html: html, next: i };
  }

  // `tight` renders paragraphs without <p> (tight list items).
  function blocks(lines, ctx, tight) {
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }

      if (isFenceOpen(line)) {
        const fm = FENCE_RE.exec(line);
        const mark = fm[2];
        const lang = fm[3].trim().split(/\s+/)[0].toLowerCase();
        const indent = indentOf(line);
        const code = [];
        for (i++; i < lines.length; i++) {
          const cm = /^\s*(`{3,}|~{3,})\s*$/.exec(lines[i]);
          if (cm && cm[1][0] === mark[0] && cm[1].length >= mark.length) { i++; break; }
          code.push(dedent(lines[i], indent));
        }
        out.push(codeBlock(code.join('\n'), lang));
        continue;
      }

      const hm = HEADING_RE.exec(line);
      if (hm) {
        const level = hm[1].length;
        const inner = inline(hm[2]);
        const text = unesc(inner.replace(/<[^>]*>/g, '')).trim();
        const id = uniqueSlug(text, ctx.ids);
        ctx.headings.push({ level: level, id: id, text: text });
        out.push('<h' + level + ' id="' + id + '">' + inner + '<a class="anchor" href="#' + id + '" aria-label="' + esc(t('anchor')) + '">#</a></h' + level + '>');
        i++;
        continue;
      }

      if (HR_RE.test(line)) { out.push('<hr>'); i++; continue; }

      if (QUOTE_RE.test(line)) {
        const inner = [];
        while (i < lines.length) {
          const l = lines[i];
          if (QUOTE_RE.test(l)) inner.push(l.replace(/^ {0,3}> ?/, ''));
          else if (l.trim() && inner.length && inner[inner.length - 1].trim() && !interrupts(lines, i)) inner.push(l);
          else break;
          i++;
        }
        out.push('<blockquote>' + blocks(inner, ctx, false) + '</blockquote>');
        continue;
      }

      if (isTableStart(lines, i)) {
        const heads = splitRow(line);
        const aligns = splitRow(lines[i + 1]).map(c => {
          const l = c.startsWith(':'), r = c.endsWith(':');
          return l && r ? ' class="al-c"' : r ? ' class="al-r"' : '';
        });
        const row = (cells, tag) => '<tr>' + heads.map((_, k) => '<' + tag + aligns[k] + '>' + inline(cells[k] || '') + '</' + tag + '>').join('') + '</tr>';
        const rows = [];
        for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes('|'); i++) rows.push(row(splitRow(lines[i]), 'td'));
        out.push('<div class="table-wrap"><table><thead>' + row(heads, 'th') + '</thead><tbody>' + rows.join('') + '</tbody></table></div>');
        continue;
      }

      if (LIST_RE.test(line)) {
        const r = listAt(lines, i, ctx);
        out.push(r.html);
        i = r.next;
        continue;
      }

      const para = [line.replace(/^\s+/, '')];
      for (i++; i < lines.length && lines[i].trim() && !interrupts(lines, i); i++) para.push(lines[i].replace(/^\s+/, ''));
      const html = inline(para.join('\n').trim());
      out.push(tight ? html : '<p>' + html + '</p>');
    }
    return out.join('\n');
  }

  function render(md) {
    const ctx = { headings: [], ids: new Set() };
    const lines = md.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
    return { html: blocks(lines, ctx, false), headings: ctx.headings };
  }

  /* ---------- page state ---------- */

  const docEl = $('rl-doc');
  const statusEl = $('rl-status');
  const filterEl = $('rl-filter');
  const tocEl = $('rl-toc');

  let lang = pickLang();
  let seq = 0;
  let headingEls = [];
  let entries = [];   // TOC entries (H2/H3) in document order
  let groups = [];    // top-level TOC entries, each with .kids
  let activeEntry = null;

  const t = key => I18N[lang][key];

  function pickLang() {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const saved = store.get(STORE_KEY);
    if (saved === 'zh' || saved === 'en') return saved;
    return (navigator.language || '').startsWith('zh') ? 'zh' : 'en';
  }

  function syncUrl(hash) {
    const u = new URL(location.href);
    u.searchParams.set('lang', lang);
    if (hash !== undefined) u.hash = hash ? '#' + hash : '';
    try { history.replaceState(null, '', u); } catch (e) { /* file:// origin is opaque */ }
  }

  function applyUi() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
    for (const el of document.querySelectorAll('[data-i18n-label]')) el.setAttribute('aria-label', t(el.dataset.i18nLabel));
    for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    const raw = $('rl-raw');
    raw.href = FILES[lang];
    raw.firstElementChild.textContent = FILES[lang].slice(2);
  }

  const headerH = () => $('rl-top').offsetHeight;

  /* ---------- TOC ---------- */

  function buildToc(headings) {
    tocEl.textContent = '';
    entries = [];
    groups = [];
    const root = document.createElement('ul');
    let curTop = null, subUl = null;
    headings.forEach((h, k) => {
      if (h.level !== 2 && h.level !== 3) return;
      const e = { k: k, text: h.text.toLowerCase(), body: '', hit: true, kids: [], li: document.createElement('li'), a: document.createElement('a') };
      e.a.href = '#' + h.id;
      e.a.textContent = h.text;
      e.li.append(e.a);
      if (h.level === 3 && curTop) {
        if (!subUl) { subUl = document.createElement('ul'); curTop.li.append(subUl); }
        subUl.append(e.li);
        curTop.kids.push(e);
      } else {
        root.append(e.li);
        groups.push(e);
        if (h.level === 2) { curTop = e; subUl = null; }
      }
      entries.push(e);
    });
    tocEl.append(root);

    // Searchable body text: everything under an H2/H3 up to the next H1-H3.
    const byEl = new Map(entries.map(e => [headingEls[e.k], e]));
    let cur = null;
    for (const el of docEl.children) {
      const m = /^H([1-6])$/.exec(el.tagName);
      if (m && +m[1] <= 3) { cur = byEl.get(el) || null; continue; }
      if (cur) cur.body += ' ' + el.textContent.toLowerCase();
    }
    applyFilter();
  }

  function applyFilter() {
    const q = filterEl.value.trim().toLowerCase();
    let any = false;
    for (const g of groups) {
      const titleHit = g.text.includes(q);
      g.hit = titleHit || g.body.includes(q);
      let kidHit = false;
      for (const kid of g.kids) {
        kid.hit = kid.text.includes(q) || kid.body.includes(q);
        kid.li.hidden = !(titleHit || kid.hit);
        kidHit = kidHit || kid.hit;
      }
      g.li.hidden = !(g.hit || kidHit);
      any = any || !g.li.hidden;
    }
    $('rl-toc-empty').hidden = any || groups.length === 0;
  }

  function setActive(entry) {
    if (entry === activeEntry) return;
    if (activeEntry) { activeEntry.a.classList.remove('active'); activeEntry.a.removeAttribute('aria-current'); }
    activeEntry = entry;
    if (!entry) return;
    entry.a.classList.add('active');
    entry.a.setAttribute('aria-current', 'location');
    const r = entry.a.getBoundingClientRect(), n = tocEl.getBoundingClientRect();
    if (r.top < n.top) tocEl.scrollTop -= n.top - r.top + 8;
    else if (r.bottom > n.bottom) tocEl.scrollTop += r.bottom - n.bottom + 8;
  }

  function updateActive() {
    if (!entries.length) return;
    const line = headerH() + 24;
    let cur = null;
    for (const e of entries) {
      if (headingEls[e.k].getBoundingClientRect().top <= line) cur = e; else break;
    }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) cur = entries[entries.length - 1];
    setActive(cur);
  }

  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateActive(); });
  }

  /* ---------- loading ---------- */

  function showStatus(html, isError) {
    statusEl.innerHTML = html;
    statusEl.classList.toggle('err', !!isError);
    statusEl.hidden = false;
  }

  function showError(err) {
    docEl.hidden = true;
    buildToc([]);
    const file = FILES[lang];
    if (location.protocol === 'file:') {
      showStatus('<h2>' + esc(t('fileTitle')) + '</h2><p>' + esc(t('fileBody')) + '</p>' +
        '<pre>python -m http.server -d docs 8000</pre>' +
        '<p><a href="./api.md">api.md</a> · <a href="./api.en.md">api.en.md</a> · <a href="./llms.txt">llms.txt</a></p>', true);
    } else {
      showStatus('<h2>' + esc(t('errTitle')) + '</h2><p>' + esc(t('errBody')(file.slice(2), err.message)) + '</p>' +
        '<p><a href="' + file + '">' + file.slice(2) + '</a></p>', true);
    }
  }

  function currentHeadingIndex() {
    const line = headerH() + 40;
    let idx = -1;
    for (let k = 0; k < headingEls.length; k++) {
      if (headingEls[k].getBoundingClientRect().top <= line) idx = k; else break;
    }
    return idx;
  }

  // `restore` is the reading position captured before a language switch; null on first load.
  function place(restore) {
    if (!restore) {
      const target = location.hash ? $(safeDecode(location.hash.slice(1))) : null;
      if (target) target.scrollIntoView();
    } else if (restore.index >= 0 && restore.count === headingEls.length) {
      const el = headingEls[restore.index];
      el.scrollIntoView();
      syncUrl(el.id);
    } else {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, restore.index < 0 ? 0 : restore.ratio * max);
      syncUrl('');
    }
  }

  async function load(restore) {
    const my = ++seq;
    if (!docEl.firstChild) showStatus('<p>' + esc(t('loading')) + '</p>');
    let md;
    try {
      const res = await fetch(FILES[lang], { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      md = await res.text();
    } catch (err) {
      if (my === seq) showError(err);
      return;
    }
    if (my !== seq) return;

    const r = render(md);
    docEl.innerHTML = r.html;
    docEl.hidden = false;
    statusEl.hidden = true;
    headingEls = Array.from(docEl.querySelectorAll('h1, h2, h3, h4, h5, h6'));
    activeEntry = null;
    buildToc(r.headings);
    place(restore);
    updateActive();
  }

  function setLang(next) {
    if (next === lang) return;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const restore = docEl.hidden ? null : { index: currentHeadingIndex(), count: headingEls.length, ratio: max > 0 ? window.scrollY / max : 0 };
    lang = next;
    store.set(STORE_KEY, lang);
    syncUrl();
    applyUi();
    load(restore);
  }

  /* ---------- events ---------- */

  function setNav(open) {
    document.body.classList.toggle('nav-open', open);
    $('rl-menu').setAttribute('aria-expanded', String(open));
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:-9999px';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { /* reported below */ }
      ta.remove();
      if (ok) resolve(); else reject(new Error('copy failed'));
    });
  }

  function flash(btn, key, cls) {
    btn.textContent = t(key);
    btn.classList.add(cls);
    setTimeout(() => { btn.textContent = t('copy'); btn.classList.remove(cls); }, 1500);
  }

  document.querySelector('.lang').addEventListener('click', e => {
    const b = e.target.closest('button[data-lang]');
    if (b) setLang(b.dataset.lang);
  });
  docEl.addEventListener('click', e => {
    const btn = e.target.closest('button.copy');
    if (!btn) return;
    copyText(btn.closest('.codeblock').querySelector('pre code').textContent)
      .then(() => flash(btn, 'copied', 'done'), () => flash(btn, 'copyFail', 'fail'));
  });
  tocEl.addEventListener('click', e => { if (e.target.closest('a')) setNav(false); });
  $('rl-menu').addEventListener('click', () => setNav(!document.body.classList.contains('nav-open')));
  $('rl-scrim').addEventListener('click', () => setNav(false));
  filterEl.addEventListener('input', applyFilter);
  filterEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { filterEl.value = ''; applyFilter(); }
    else if (e.key === 'Enter' && filterEl.value.trim()) {
      const first = entries.find(x => x.hit);
      if (first) first.a.click();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setNav(false); });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { onScroll(); if (window.innerWidth > 900) setNav(false); });

  syncUrl();
  applyUi();
  load(null);
})();
</script>
</body>
</html>
